<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PAW — Desafio de Reboque</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
  body {
    background: #001a2e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100dvh; overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
  }
  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 14px;
    background: linear-gradient(180deg,rgba(0,0,0,.55) 0%,transparent 100%);
    z-index: 10; pointer-events: none;
  }
  #ui .pill {
    background: rgba(0,30,60,.7);
    border: 1px solid rgba(0,180,255,.35);
    border-radius: 20px; padding: 4px 12px;
    color: #7df4ff; font-size: 13px; font-weight: 600;
  }
  canvas { display: block; touch-action: none; }
  #overlay {
    position: fixed; inset: 0;
    background: rgba(0,10,25,.92);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 20; gap: 16px;
  }
  #overlay h1 { color:#7df4ff; font-size:clamp(28px,7vw,46px); text-shadow:0 0 22px #00cfff; letter-spacing:3px; }
  #overlay h2 { color:#00cfff; font-size:clamp(14px,3.5vw,20px); }
  #overlay p  { color:#aaddee; font-size:clamp(12px,2.8vw,14px); text-align:center; max-width:360px; line-height:1.7; }
  #overlay button {
    margin-top:8px; padding:14px 48px; font-size:17px; font-weight:700;
    background:linear-gradient(135deg,#0077aa,#00cfff); color:#fff;
    border:none; border-radius:30px; cursor:pointer;
    box-shadow:0 0 26px #00cfff88; letter-spacing:1px;
  }
  #overlay button:active { transform:scale(.97); }
  #hint {
    position:fixed; bottom:14px; right:14px;
    color:rgba(120,220,255,.7); font-size:11px;
    z-index:10; text-align:right; pointer-events:none;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
  }
</style>
</head>
<body>

<div id="ui">
  <div class="pill" id="ui-mission">Missão 1 / 3</div>
  <div class="pill" id="ui-phase">Fase: Aproximar</div>
  <div class="pill" id="ui-score">Pontos: 0</div>
</div>

<canvas id="c"></canvas>
<div id="hint">Toque para mover</div>

<div id="overlay">
  <h1>⚓ PAW</h1>
  <h2>Desafio de Reboque</h2>
  <p>Pilote o rebocador · conecte o cabo na proa do navio<br>
     conduza pelo corredor de boias até o cais<br>
     e atraque sem bater nas boias!</p>
  <p style="font-size:11px;opacity:.65">
    📱 Joystick virtual (esq.) · Botão AÇÃO (dir.)<br>
    🖥️ WASD / Setas · Espaço = conectar/soltar
  </p>
  <button id="btn-start">ZARPAR ⚓</button>
</div>

const imgTug      = svgImg(tugSVG);

// ─── Constants ────────────────────────────────────────────────────────────────
const TUG_SPEED    = 3.2;
const TUG_TURN     = 0.045;
const CABLE_LEN    = 72;
const CABLE_STIFF  = 0.06;
const SHIP_DRAG    = 0.97;
const SHIP_ANGDRAG = 0.94;
const CONNECT_DIST = 50;
const DOCK_DIST    = 40;
const PUSH_FORCE   = 0.18;
const BUOY_R       = 13;
const PENALTY      = 80;

// ─── State ────────────────────────────────────────────────────────────────────
let W, H;
let tug, ship, buoys, berths, targetBerth;
let phase; // 'approach'|'towing'|'pushing'|'docked'
let score = 0, mission = 0;
const totalMissions = 3;
let buoyHits = 0, levelTime = 0;
let particles = [], wakes = [];
let waveOffset = 0;
let connectBtnRect = null;

// ─── Input ────────────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true;  if (e.key === ' ') handleAction(); });
window.addEventListener('keyup',   e => { keys[e.key] = false; });

let joyActive = false, joyStartX = 0, joyStartY = 0, joyDX = 0, joyDY = 0;
canvas.addEventListener('touchstart', onTS, {passive:false});
canvas.addEventListener('touchmove',  onTM, {passive:false});
canvas.addEventListener('touchend',   onTE, {passive:false});
canvas.addEventListener('mousedown',  e => { if (inConnBtn(e.clientX, e.clientY)) handleAction(); });

function inJoyZone(x, y) { return x < 160 && y > canvas.height - 160; }
function inConnBtn(x, y) {
  if (!connectBtnRect) return false;
  const r = connectBtnRect;
  return x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h;
}
function onTS(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (inConnBtn(t.clientX, t.clientY)) { handleAction(); continue; }
    if (inJoyZone(t.clientX, t.clientY) && !joyActive) {
      joyActive = true; joyStartX = t.clientX; joyStartY = t.clientY; joyDX = joyDY = 0;
    }
  }
}
function onTM(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (!joyActive) continue;
    joyDX = t.clientX - joyStartX; joyDY = t.clientY - joyStartY;
    const len = Math.hypot(joyDX, joyDY), maxR = 40;
    if (len > maxR) { joyDX = joyDX/len*maxR; joyDY = joyDY/len*maxR; }
  }
}
function onTE(e) { e.preventDefault(); joyActive = false; joyDX = joyDY = 0; }

// ─── Level ────────────────────────────────────────────────────────────────────
function buildLevel() {
  W = canvas.width; H = canvas.height;

  const portX    = W * 0.72;
  const berthW   = 94, berthH = 58;
  const spacing  = berthH + 22;
  const startY   = H/2 - (3*berthH + 2*22)/2;

  berths = Array.from({length:3}, (_, i) => ({
    x: portX, y: startY + i*spacing, w: berthW, h: berthH,
    docked: false, id: i,
  }));

  // Keep previously docked berths
  if (mission > 0) {
    for (let i = 0; i < mission; i++) berths[i % 3].docked = true;
  }

  targetBerth = berths[mission % 3];
  targetBerth.docked = false;

  const channelY   = targetBerth.y + berthH/2;
  const cStartX    = W * 0.22;
  const cEndX      = portX - 14;
  const halfW      = 46;
  const numPairs   = 7;
  buoys = [];
  for (let i = 0; i <= numPairs; i++) {
    const bx = cStartX + (cEndX - cStartX) * (i / numPairs);
    buoys.push({ x:bx, y:channelY - halfW, r:BUOY_R, hit:false, wobble:Math.random()*Math.PI*2 });
    buoys.push({ x:bx, y:channelY + halfW, r:BUOY_R, hit:false, wobble:Math.random()*Math.PI*2 });
  }

  const sx = W * 0.1, sy = H * 0.35;
  ship = { x:sx, y:sy, vx:0, vy:0, angle:0, angVel:0, len:90, wid:25, connected:false };
  tug  = { x:sx - 100, y:sy + 50, vx:0, vy:0, angle:0, len:44, wid:20 };

  phase = 'approach'; buoyHits = 0; levelTime = 0; particles = []; wakes = [];
  updateUI();
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
const shipBow   = () => ({ x: ship.x + Math.cos(ship.angle)*ship.len/2,  y: ship.y + Math.sin(ship.angle)*ship.len/2 });
const shipStern = () => ({ x: ship.x - Math.cos(ship.angle)*ship.len/2,  y: ship.y - Math.sin(ship.angle)*ship.len/2 });
const tugFront  = () => ({ x: tug.x  + Math.cos(tug.angle) *tug.len/2,   y: tug.y  + Math.sin(tug.angle) *tug.len/2 });

// ─── Action (connect / release) ───────────────────────────────────────────────
function handleAction() {
  if (phase === 'approach') {
    const bow = shipBow(), tf = tugFront();
    if (Math.hypot(tf.x-bow.x, tf.y-bow.y) < CONNECT_DIST) {
      ship.connected = true; phase = 'towing';
      spawnParticles(bow.x, bow.y, '#00ffcc', 14);
      updateUI();
    }
  } else if (phase === 'towing') {
    const tb = targetBerth;
    if (Math.hypot(ship.x-(tb.x+tb.w/2), ship.y-(tb.y+tb.h/2)) < 130) {
      ship.connected = false; phase = 'pushing'; updateUI();
    }
  }
}

// ─── Physics ──────────────────────────────────────────────────────────────────
function update(dt) {
  waveOffset += 0.012; levelTime += dt;

  let thrust = 0, turn = 0;
  if (keys['ArrowUp']   ||keys['w']||keys['W']) thrust =  1;
  if (keys['ArrowDown'] ||keys['s']||keys['S']) thrust = -0.4;
  if (keys['ArrowLeft'] ||keys['a']||keys['A']) turn   = -1;
  if (keys['ArrowRight']||keys['d']||keys['D']) turn   =  1;

  if (Math.hypot(joyDX, joyDY) > 4) {
    const jA = Math.atan2(joyDY, joyDX);
    const d  = angleDiff(jA, tug.angle);
    turn   = Math.sign(d) * Math.min(Math.abs(d)/0.5, 1);
    thrust = Math.cos(d) * (Math.hypot(joyDX,joyDY) / 40);
  }

  tug.angle += turn * TUG_TURN;
  tug.vx    += Math.cos(tug.angle) * TUG_SPEED * thrust * 0.12;
  tug.vy    += Math.sin(tug.angle) * TUG_SPEED * thrust * 0.12;
  tug.vx    *= 0.88; tug.vy *= 0.88;
  tug.x = clamp(tug.x + tug.vx, 24, W - 24);
  tug.y = clamp(tug.y + tug.vy, 24, H - 24);

  // Wake trail
  const spd = Math.hypot(tug.vx, tug.vy);
  if (spd > 0.25) {
    const stern = { x: tug.x - Math.cos(tug.angle)*tug.len/2, y: tug.y - Math.sin(tug.angle)*tug.len/2 };
    wakes.push({ x:stern.x, y:stern.y, life:1, r: 4 + spd*3 });
  }
  for (let i = wakes.length-1; i >= 0; i--) {
    wakes[i].life -= 0.018; wakes[i].r += 0.4;
    if (wakes[i].life <= 0) wakes.splice(i, 1);
  }

  if (phase === 'towing' && ship.connected) {
    const bow = shipBow(), tf = tugFront();
    const dx = tf.x - bow.x, dy = tf.y - bow.y;
    const dist = Math.hypot(dx, dy);
    if (dist > CABLE_LEN) {
      const over = dist - CABLE_LEN, nx = dx/dist, ny = dy/dist, f = over * CABLE_STIFF;
      ship.vx += nx*f; ship.vy += ny*f;
      const br = { x: bow.x - ship.x, y: bow.y - ship.y };
      ship.angVel += (br.x*ny*f - br.y*nx*f) * 0.004;
    }
    ship.vx *= SHIP_DRAG; ship.vy *= SHIP_DRAG;
    ship.angVel *= SHIP_ANGDRAG;
    ship.x += ship.vx; ship.y += ship.vy; ship.angle += ship.angVel;
  }

  if (phase === 'pushing') {
    const tf = tugFront(), stern = shipStern();
    if (Math.hypot(tf.x-stern.x, tf.y-stern.y) < 34) {
      ship.vx += Math.cos(tug.angle)*PUSH_FORCE;
      ship.vy += Math.sin(tug.angle)*PUSH_FORCE;
    }
    ship.vx *= SHIP_DRAG; ship.vy *= SHIP_DRAG;
    ship.angVel *= SHIP_ANGDRAG;
    ship.x += ship.vx; ship.y += ship.vy; ship.angle += ship.angVel;
    const tb = targetBerth;
    if (Math.hypot(ship.x-(tb.x+tb.w/2), ship.y-(tb.y+tb.h/2)) < DOCK_DIST) dockedSuccess();
  }

  if (phase === 'towing' || phase === 'pushing') checkBuoys();

  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= 0.022;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function checkBuoys() {
  const corners = shipCorners();
  for (const b of buoys) {
    if (b.hit) continue;
    if (pointNearPoly(b.x, b.y, corners, b.r + 4)) {
      b.hit = true; buoyHits++;
      score = Math.max(0, score - PENALTY);
      spawnParticles(b.x, b.y, '#ff4444', 10); updateUI();
    }
  }
}
function shipCorners() {
  const ca = Math.cos(ship.angle), sa = Math.sin(ship.angle), hw = ship.wid/2, hl = ship.len/2;
  return [
    {x: ship.x+ca*hl-sa*hw, y: ship.y+sa*hl+ca*hw},
    {x: ship.x+ca*hl+sa*hw, y: ship.y+sa*hl-ca*hw},
    {x: ship.x-ca*hl+sa*hw, y: ship.y-sa*hl-ca*hw},
    {x: ship.x-ca*hl-sa*hw, y: ship.y-sa*hl+ca*hw},
  ];
}
function pointNearPoly(px, py, poly, radius) {
  const n = poly.length;
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i+1)%n];
    if (distSeg(px,py,a.x,a.y,b.x,b.y) < radius) return true;
  }
  let inside = false;
  for (let i = 0, j = n-1; i < n; j = i++) {
    if ((poly[i].y > py) !== (poly[j].y > py) &&
        px < (poly[j].x-poly[i].x)*(py-poly[i].y)/(poly[j].y-poly[i].y)+poly[i].x) inside = !inside;
  }
  return inside;
}
function distSeg(px,py,ax,ay,bx,by) {
  const dx=bx-ax, dy=by-ay, l2=dx*dx+dy*dy;
  if (!l2) return Math.hypot(px-ax,py-ay);
  const t = clamp(((px-ax)*dx+(py-ay)*dy)/l2, 0, 1);
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}

function dockedSuccess() {
  if (phase === 'docked') return;
  phase = 'docked'; targetBerth.docked = true;
  score += Math.max(0, 500 + Math.floor(300 - levelTime/1000*5) - buoyHits*PENALTY);
  spawnParticles(ship.x, ship.y, '#ffd700', 32);
  spawnParticles(ship.x, ship.y, '#00ffcc', 20);
  updateUI();
  if (mission + 1 >= totalMissions) setTimeout(showVictory, 1400);
  else setTimeout(() => { mission++; buildLevel(); }, 2000);
}

// ─── Render ───────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0, 0, W, H);
  drawWater();
  drawPort();
  drawBerths();
  drawBuoys();
  drawWakes();
  if (phase === 'towing') drawCable();
  drawShipSprite();
  drawTugSprite();
  drawParticles();
  drawConnectBtn();
  drawJoystick();
  drawPhaseHint();
}

// ── Water ──
function drawWater() {
  const g = ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#004466'); g.addColorStop(1,'#001a2e');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(0,130,210,0.14)'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 20; i++) {
    const yb = ((H/20)*i + waveOffset*20 + i*41) % H;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = yb + Math.sin(x*0.022 + waveOffset + i*0.7)*6;
      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

// ── Port ──
function drawPort() {
  const px = W * 0.72;

  // Deep water shadow at quay edge
  const sg = ctx.createLinearGradient(px, 0, px+30, 0);
  sg.addColorStop(0,'rgba(0,0,0,0.35)'); sg.addColorStop(1,'transparent');
  ctx.fillStyle = sg; ctx.fillRect(px, 0, 30, H);

  // Quay concrete
  ctx.fillStyle = '#4a4035';
  ctx.fillRect(px+92, 0, W-px-92, H);

  // Concrete texture strips
  ctx.strokeStyle = '#3a3028'; ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 18) {
    ctx.beginPath(); ctx.moveTo(px+92,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // Quay face (edge wall)
  ctx.fillStyle = '#6a5a48';
  ctx.fillRect(px+88, 0, 8, H);
  // Top highlight
  ctx.fillStyle = '#8a7a68';
  ctx.fillRect(px+88, 0, 2, H);

  // Warehouse buildings
  const warehouses = [
    { x: px+100, y: 10,      w: Math.min(W-px-110, 120), h: H*0.25 },
    { x: px+100, y: H*0.38,  w: Math.min(W-px-110, 100), h: H*0.22 },
    { x: px+100, y: H*0.72,  w: Math.min(W-px-110, 110), h: H*0.24 },
  ];
  for (const wh of warehouses) {
    if (wh.x + wh.w > W - 4) continue;
    // Building shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(wh.x+4, wh.y+4, wh.w, wh.h);
    // Building body
    ctx.fillStyle = '#5a5040';
    ctx.fillRect(wh.x, wh.y, wh.w, wh.h);
    // Roof
    ctx.fillStyle = '#4a4030';
    ctx.fillRect(wh.x, wh.y, wh.w, 8);
    // Doors
    const doorW = 16, doorH = 22;
    for (let dx = wh.x + 14; dx < wh.x+wh.w-doorW; dx += doorW+14) {
      ctx.fillStyle = '#2a2018';
      ctx.fillRect(dx, wh.y+wh.h-doorH, doorW, doorH);
      ctx.strokeStyle = '#3a3028'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(dx+doorW/2, wh.y+wh.h-doorH); ctx.lineTo(dx+doorW/2, wh.y+wh.h); ctx.stroke();
    }
    // Windows
    ctx.fillStyle = '#ffeeaa';
    for (let wx = wh.x+10; wx < wh.x+wh.w-8; wx += 18) {
      ctx.fillRect(wx, wh.y+12, 8, 6);
    }
  }

  // Portal crane (simplified top-down silhouette)
  drawCrane(px + 94, H * 0.18);
  drawCrane(px + 94, H * 0.60);
}

function drawCrane(x, y) {
  // Crane base legs
  ctx.fillStyle = '#778899';
  ctx.fillRect(x, y-4, 6, 20);
  ctx.fillRect(x+14, y-4, 6, 20);
  // Crane beam
  ctx.fillStyle = '#8899aa';
  ctx.fillRect(x-8, y-6, 36, 5);
  // Hook cable
  ctx.strokeStyle = '#556677'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x+10, y-1); ctx.lineTo(x+10, y+14); ctx.stroke();
  // Hook
  ctx.beginPath(); ctx.arc(x+10, y+16, 3, 0, Math.PI*2);
  ctx.fillStyle = '#445566'; ctx.fill();
}

// ── Berths ──
function drawBerths() {
  const now = Date.now();
  for (const b of berths) {
    const isTarget = b === targetBerth && phase !== 'docked';
    const isDocked  = b.docked;
    const pulse     = 0.5 + 0.5 * Math.sin(now * 0.004);

    // Water area of berth
    ctx.save();
    if (isDocked) {
      ctx.fillStyle   = 'rgba(0,255,120,0.15)';
      ctx.strokeStyle = '#00ff88';
    } else if (isTarget) {
      ctx.fillStyle   = `rgba(0,180,255,${0.06+pulse*0.12})`;
      ctx.strokeStyle = `rgba(0,200,255,${0.4+pulse*0.6})`;
    } else {
      ctx.fillStyle   = 'rgba(0,0,0,0.15)';
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    }
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.rect(b.x, b.y, b.w, b.h);
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // Arrow guides into berth when target
    if (isTarget) {
      ctx.save();
      ctx.globalAlpha = 0.35 + pulse*0.35;
      ctx.fillStyle = '#00eeff';
      for (let aw = 0; aw < 3; aw++) {
        const ax = b.x + 14 + aw*20;
        const ay = b.y + b.h/2;
        ctx.beginPath();
        ctx.moveTo(ax, ay-7); ctx.lineTo(ax+10, ay); ctx.lineTo(ax, ay+7);
        ctx.fill();
      }
      ctx.restore();
    }

    // Mooring bollards (4 corners)
    const bollardPositions = [
      [b.x+6, b.y+8], [b.x+6, b.y+b.h-8],
    ];
    for (const [bx, by] of bollardPositions) {
      ctx.beginPath(); ctx.arc(bx, by, 5, 0, Math.PI*2);
      ctx.fillStyle = '#7a6a58'; ctx.fill();
      ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2);
      ctx.fillStyle = '#9a8a78'; ctx.fill();
      // Mooring rope
      if (isDocked) {
        ctx.strokeStyle = '#886644'; ctx.lineWidth = 1.5;
        ctx.setLineDash([3,3]);
        ctx.beginPath(); ctx.moveTo(bx+4, by); ctx.lineTo(bx+24, by); ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Label
    ctx.fillStyle = isDocked ? '#00ff88' : isTarget ? '#7df4ff' : 'rgba(255,255,255,0.25)';
    ctx.font = `bold ${isTarget?13:11}px monospace`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(isDocked ? `✓ CAIS ${b.id+1}` : `CAIS ${b.id+1}`, b.x+b.w/2+6, b.y+b.h/2);
  }
}

// ── Buoys ──
function drawBuoys() {
  for (const b of buoys) {
    b.wobble += 0.038;
    const wx = Math.sin(b.wobble)*2.4, wy = Math.cos(b.wobble*0.65)*1.6;
    const x = b.x+wx, y = b.y+wy;
    const img = b.hit ? imgBuoyHit : imgBuoy;
    const s = b.r * 2.2;
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, x-s/2, y-s/2, s, s);
    } else {
      // Fallback circle
      ctx.beginPath(); ctx.arc(x,y,b.r,0,Math.PI*2);
      ctx.fillStyle = b.hit ? '#aa0000' : '#cc5500'; ctx.fill();
    }
    // Chain shadow
    ctx.strokeStyle = 'rgba(120,90,50,0.4)'; ctx.lineWidth = 1;
    ctx.setLineDash([2,3]);
    ctx.beginPath(); ctx.moveTo(x, y+b.r+1); ctx.lineTo(x+Math.sin(b.wobble*0.4)*3, y+b.r+16); ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ── Wakes ──
function drawWakes() {
  for (const w of wakes) {
    ctx.save();
    ctx.globalAlpha = w.life * 0.35;
    ctx.beginPath(); ctx.arc(w.x, w.y, w.r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

// ── Cable ──
function drawCable() {
  const bow = shipBow(), tf = tugFront();
  const dist = Math.hypot(tf.x-bow.x, tf.y-bow.y);
  const taut = dist >= CABLE_LEN * 0.88;
  ctx.save(); ctx.lineCap = 'round';
  ctx.lineWidth   = taut ? 3 : 2;
  ctx.strokeStyle = taut ? '#ffcc00' : '#997744';
  ctx.setLineDash(taut ? [] : [7,5]);
  ctx.beginPath(); ctx.moveTo(bow.x, bow.y);
  if (taut) { ctx.lineTo(tf.x, tf.y); }
  else { ctx.quadraticCurveTo((bow.x+tf.x)/2, (bow.y+tf.y)/2+14, tf.x, tf.y); }
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
  // Shackle at bow
  ctx.beginPath(); ctx.arc(bow.x, bow.y, 5, 0, Math.PI*2);
  ctx.fillStyle = '#ffdd44'; ctx.fill();
  ctx.strokeStyle = '#cc9900'; ctx.lineWidth = 1; ctx.stroke();
  // Shackle at tug
  ctx.beginPath(); ctx.arc(tf.x, tf.y, 4, 0, Math.PI*2);
  ctx.fillStyle = '#ffdd44'; ctx.fill();
}

// ── Ship Sprite ──
function drawShipSprite() {
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  // Drop shadow
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 10; ctx.shadowOffsetX = 3; ctx.shadowOffsetY = 4;
  const sl = ship.len, sw = ship.wid * 1.8;
  if (imgShip.complete && imgShip.naturalWidth) {
    ctx.drawImage(imgShip, -sl/2, -sw/2, sl, sw);
  } else {
    ctx.fillStyle = '#1a3a5c'; ctx.fillRect(-sl/2, -sw/2, sl, sw);
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  // Bow connect indicator
  const bowX = sl/2 - 8;
  ctx.beginPath(); ctx.arc(bowX, 0, 6, 0, Math.PI*2);
  ctx.fillStyle = phase === 'approach' ? 'rgba(0,255,180,0.85)' : 'rgba(255,200,0,0.8)';
  ctx.fill();
  ctx.strokeStyle = phase === 'approach' ? '#00ffaa' : '#ffaa00';
  ctx.lineWidth = 2; ctx.stroke();
  // Pulsing ring when approachable
  if (phase === 'approach') {
    const bow = shipBow(), tf = tugFront();
    if (Math.hypot(tf.x-bow.x, tf.y-bow.y) < CONNECT_DIST * 1.5) {
      const pulse = 0.5 + 0.5*Math.sin(Date.now()*0.008);
      ctx.beginPath(); ctx.arc(bowX, 0, 10+pulse*6, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(0,255,180,${0.4*pulse})`;
      ctx.lineWidth = 2; ctx.stroke();
    }
  }
  ctx.restore();
}

// ── Tug Sprite ──
function drawTugSprite() {
  ctx.save();
  ctx.translate(tug.x, tug.y);
  ctx.rotate(tug.angle);
  ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 3;
  const tl = tug.len, tw = tug.wid * 2.0;
  if (imgTug.complete && imgTug.naturalWidth) {
    ctx.drawImage(imgTug, -tl/2, -tw/2, tl, tw);
  } else {
    ctx.fillStyle = '#cc2200'; ctx.fillRect(-tl/2, -tw/2, tl, tw);
  }
  ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  // Exhaust smoke puffs (animated)
  const smokePhase = (Date.now() * 0.002) % 1;
  const smokeY = -tw/2 - 4 - smokePhase * 8;
  ctx.beginPath(); ctx.arc(-tl*0.12, smokeY, 3+smokePhase*3, 0, Math.PI*2);
  ctx.fillStyle = `rgba(180,180,180,${0.4*(1-smokePhase)})`;
  ctx.fill();
  ctx.restore();
}

// ── Particles ──
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2);
    ctx.fillStyle = p.color; ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, s = 1+Math.random()*3.5;
    particles.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, r:3+Math.random()*5, color, life:1 });
  }
}

// ── Connect Button ──
function drawConnectBtn() {
  const bw=120, bh=48, bx=W-bw-16, by=H-bh-16;
  connectBtnRect = {x:bx, y:by, w:bw, h:bh};

  let label='', bg='rgba(0,70,110,0.8)', border='rgba(0,180,255,0.5)', fg='#7df4ff', glow=false;

  if (phase === 'approach') {
    const bow=shipBow(), tf=tugFront();
    const near = Math.hypot(tf.x-bow.x, tf.y-bow.y) < CONNECT_DIST;
    label  = near ? '🔗 CONECTAR' : '⚓ APROXIMAR';
    if (near) { bg='rgba(0,140,70,0.9)'; border='#00ff88'; fg='#00ff88'; glow=true; }
  } else if (phase === 'towing') {
    const tb=targetBerth;
    const near = Math.hypot(ship.x-(tb.x+tb.w/2), ship.y-(tb.y+tb.h/2)) < 130;
    label  = near ? '✂️ SOLTAR CABO' : '🚢 REBOCANDO';
    if (near) { bg='rgba(140,70,0,0.9)'; border='#ffaa00'; fg='#ffcc44'; glow=true; }
  } else if (phase === 'pushing') {
    label='⬆️ EMPURRAR'; bg='rgba(70,0,110,0.8)'; border='#aa44ff'; fg='#dd88ff';
  } else {
    label='✅ ATRACADO!'; bg='rgba(0,90,45,0.9)'; border='#00ff88'; fg='#00ff88'; glow=true;
  }

  ctx.save();
  if (glow) { ctx.shadowColor = border; ctx.shadowBlur = 14; }
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 14);
  ctx.fillStyle=bg; ctx.fill();
  ctx.strokeStyle=border; ctx.lineWidth=2; ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle=fg; ctx.font='bold 13px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label, bx+bw/2, by+bh/2);
  ctx.restore();
}

// ── Joystick ──
function drawJoystick() {
  const cx=58, cy=H-58, outerR=44, innerR=20;
  ctx.beginPath(); ctx.arc(cx, cy, outerR, 0, Math.PI*2);
  ctx.fillStyle='rgba(0,20,50,0.55)'; ctx.fill();
  ctx.strokeStyle='rgba(0,160,255,0.28)'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='rgba(0,160,255,0.18)';
  ctx.font='15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('▲',cx,cy-27); ctx.fillText('▼',cx,cy+27);
  ctx.fillText('◀',cx-27,cy); ctx.fillText('▶',cx+27,cy);
  const kx=cx+(joyActive?joyDX:0), ky=cy+(joyActive?joyDY:0);
  const kg=ctx.createRadialGradient(kx-4,ky-4,1,kx,ky,innerR);
  kg.addColorStop(0,'#3377bb'); kg.addColorStop(1,'#001133');
  ctx.beginPath(); ctx.arc(kx,ky,innerR,0,Math.PI*2);
  ctx.fillStyle=kg; ctx.fill();
  ctx.strokeStyle='rgba(0,180,255,0.5)'; ctx.lineWidth=1.5; ctx.stroke();
}

// ── Phase hint ──
function drawPhaseHint() {
  const el = document.getElementById('hint');
  const bow=shipBow(), tf=tugFront();
  const near = phase==='approach' && Math.hypot(tf.x-bow.x, tf.y-bow.y)<CONNECT_DIST;
  const hints = {
    approach: near ? '✅ Pressione CONECTAR!' : '🚤 Aproxime da proa do navio',
    towing:   '🚢 Reboque pelo corredor · não bata nas boias!',
    pushing:  '⬆️ Encoste e empurre o navio para o cais',
    docked:   mission+1 < totalMissions ? '🎉 Atracado! Próxima missão...' : '🏆 Todas as missões concluídas!',
  };
  el.textContent = hints[phase] || '';
}

// ─── Overlay ──────────────────────────────────────────────────────────────────
function showVictory() {
  const ov = document.getElementById('overlay');
  ov.innerHTML = `
    <h1>🏆 VITÓRIA!</h1>
    <p>Você atracou todos os ${totalMissions} navios com sucesso!</p>
    <p>Pontuação final: <strong style="color:#ffd700;font-size:24px">${score}</strong></p>
    <p style="font-size:11px;opacity:.65">Boias atingidas: ${buoyHits} × ${PENALTY} pts de penalidade</p>
    <button id="btn-restart">JOGAR NOVAMENTE</button>`;
  ov.style.display='flex';
  document.getElementById('btn-restart').addEventListener('click', startGame);
}
function updateUI() {
  document.getElementById('ui-mission').textContent = `Missão ${mission+1} / ${totalMissions}`;
  document.getElementById('ui-score').textContent   = `Pontos: ${score}`;
  const label = {approach:'Aproximar',towing:'Rebocando',pushing:'Empurrando',docked:'Atracado!'};
  document.getElementById('ui-phase').textContent   = `Fase: ${label[phase]||phase}`;
}

// ─── Utils ────────────────────────────────────────────────────────────────────
const clamp = (v,lo,hi) => v<lo?lo:v>hi?hi:v;
function angleDiff(a,b) {
  let d=a-b;
  while(d> Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  return d;
}

// ─── Loop ─────────────────────────────────────────────────────────────────────
let lastTime = 0;
function loop(ts) { const dt=ts-lastTime; lastTime=ts; update(dt); draw(); requestAnimationFrame(loop); }

function startGame() {
  score=0; mission=0;
  document.getElementById('overlay').style.display='none';
  buildLevel();
}

document.getElementById('btn-start').addEventListener('click', startGame);
requestAnimationFrame(loop);
</script>
